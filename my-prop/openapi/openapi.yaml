openapi: 3.1.0
info:
  title: myprop.live API
  version: 0.1.0
  description: |
    Schema-first contract for the myprop.live app. Until a backend exists it is
    served by MSW (src/mocks). Paths are relative to the /api server.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: leads
    description: CRM leads and their pipeline stage
  - name: campaigns
    description: WhatsApp, Email and SMS marketing campaigns
  - name: team
    description: Workspace members, invitations and roles
  - name: domains
    description: Custom domains that point to websites
  - name: api-keys
    description: Keys for calling the myprop.live API from other systems
  - name: integrations
    description: Third-party services the workspace connects to

paths:
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads, newest first
      parameters:
        - name: q
          in: query
          description: Matches name, email or phone (digits only for phone-like queries).
          schema:
            type: string
        - name: source
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LeadSource"
        - name: stage
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LeadStage"
        - name: budget
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: configuration
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: project
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: tag
          in: query
          description: Leads that have at least one of these tags.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: addedFrom
          in: query
          description: Inclusive lower bound on addedAt.
          schema:
            type: string
            format: date-time
        - name: addedTo
          in: query
          description: Inclusive upper bound on addedAt.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Matching leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /leads/{leadId}:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead
      responses:
        "200":
          description: The lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update some fields of a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns, newest first
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CampaignStatus"
      responses:
        "200":
          description: Matching campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create (launch or schedule) a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /campaigns/{campaignId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update some fields of a campaign (also pauses and resumes it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /team/members:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List workspace members and pending invitations, oldest first
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: inviteTeamMember
      tags: [team]
      summary: Invite someone by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInvite"
      responses:
        "201":
          description: The invited member (status invited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /team/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: getTeamMember
      tags: [team]
      summary: Get a member
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Change a member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: removeTeamMember
      tags: [team]
      summary: Remove a member or cancel their invitation
      description: The workspace owner can't be removed (422).
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /domains:
    get:
      operationId: listDomains
      tags: [domains]
      summary: List custom domains, oldest first
      responses:
        "200":
          description: Domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDomain
      tags: [domains]
      summary: Add a domain. It stays pending until its DNS records verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainInput"
      responses:
        "201":
          description: The pending domain, with the DNS records to configure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /domains/{domainId}:
    parameters:
      - $ref: "#/components/parameters/DomainId"
    get:
      operationId: getDomain
      tags: [domains]
      summary: Get a domain
      responses:
        "200":
          description: The domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDomain
      tags: [domains]
      summary: Remove a domain
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /domains/{domainId}/verify:
    parameters:
      - $ref: "#/components/parameters/DomainId"
    post:
      operationId: verifyDomain
      tags: [domains]
      summary: Check the domain's DNS records now
      description: Returns the domain; status becomes active once the records resolve.
      responses:
        "200":
          description: The domain after the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List API keys, oldest first (secrets are never returned here)
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Generate a key. The response is the only time the secret is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: The new key, including its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyWithSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api-keys/{apiKeyId}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke a key. Requests using it are rejected from then on.
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: Connection state and settings of every available integration
      responses:
        "200":
          description: One entry per integration in the catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /integrations/{integrationId}:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    patch:
      operationId: updateIntegration
      tags: [integrations]
      summary: Save a connected integration's settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationUpdate"
      responses:
        "200":
          description: Updated integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /integrations/{integrationId}/connect:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    post:
      operationId: connectIntegration
      tags: [integrations]
      summary: Connect an integration
      responses:
        "200":
          description: The connected integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /integrations/{integrationId}/disconnect:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    post:
      operationId: disconnectIntegration
      tags: [integrations]
      summary: Disconnect an integration (its settings are kept)
      responses:
        "200":
          description: The disconnected integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /integrations/{integrationId}/test:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    post:
      operationId: testIntegration
      tags: [integrations]
      summary: Check that a connected integration responds with its saved settings
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IntegrationId"
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LeadId:
      name: leadId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LeadSource:
      type: string
      enum: [website, whatsapp, social, referral, walk-in]

    LeadStage:
      type: string
      enum: [new, contacted, interested, scheduled, negotiation, closed, lost]

    LeadInput:
      type: object
      description: Fields a client can set when creating a lead.
      required: [name, phone, source]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          description: Empty string when unknown.
        source:
          $ref: "#/components/schemas/LeadSource"
        budget:
          type: string
        configuration:
          type: string
        project:
          type: string
        stage:
          $ref: "#/components/schemas/LeadStage"
        tags:
          type: array
          items:
            type: string
        notes:
          type: string

    LeadUpdate:
      type: object
      description: Partial update. Omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
        source:
          $ref: "#/components/schemas/LeadSource"
        budget:
          type: string
        configuration:
          type: string
        project:
          type: string
        stage:
          $ref: "#/components/schemas/LeadStage"
        tags:
          type: array
          items:
            type: string
        notes:
          type: string

    Lead:
      type: object
      required:
        [id, name, phone, email, source, budget, configuration, project, stage, tags, notes, addedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        source:
          $ref: "#/components/schemas/LeadSource"
        budget:
          type: string
        configuration:
          type: string
        project:
          type: string
        stage:
          $ref: "#/components/schemas/LeadStage"
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        addedAt:
          type: string
          format: date-time

    CampaignChannel:
      type: string
      enum: [WhatsApp, Email, SMS]

    CampaignStatus:
      type: string
      enum: [active, paused, scheduled]

    CampaignScheduleType:
      type: string
      enum: [immediate, scheduled, recurring, triggered]

    CampaignFrequency:
      type: string
      enum: [daily, weekly, monthly]

    CampaignInput:
      type: object
      description: |
        Fields a client sets when creating a campaign. The client sends the
        status it launches with (scheduled or active); it defaults to active.
      required: [name, type, audience, message, scheduleType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        objective:
          type: string
          description: One of the objective option values, or empty.
        type:
          $ref: "#/components/schemas/CampaignChannel"
        audience:
          type: array
          description: Audience segment ids.
          items:
            type: string
        subject:
          type: string
          description: Required for Email campaigns.
        message:
          type: string
        aiTone:
          type: string
        scheduleType:
          $ref: "#/components/schemas/CampaignScheduleType"
        scheduleDate:
          type: [string, "null"]
          format: date
          description: Local calendar date. Required when scheduleType is scheduled.
        scheduleTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Local time as HH:mm (scheduled and recurring campaigns).
        frequency:
          $ref: "#/components/schemas/CampaignFrequency"
        triggerEvent:
          type: string
          description: Required when scheduleType is triggered.
        status:
          $ref: "#/components/schemas/CampaignStatus"

    CampaignUpdate:
      type: object
      description: Partial update. Omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        objective:
          type: string
          description: One of the objective option values, or empty.
        type:
          $ref: "#/components/schemas/CampaignChannel"
        audience:
          type: array
          description: Audience segment ids.
          items:
            type: string
        subject:
          type: string
          description: Required for Email campaigns.
        message:
          type: string
        aiTone:
          type: string
        scheduleType:
          $ref: "#/components/schemas/CampaignScheduleType"
        scheduleDate:
          type: [string, "null"]
          format: date
          description: Local calendar date. Required when scheduleType is scheduled.
        scheduleTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Local time as HH:mm (scheduled and recurring campaigns).
        frequency:
          $ref: "#/components/schemas/CampaignFrequency"
        triggerEvent:
          type: string
          description: Required when scheduleType is triggered.
        status:
          $ref: "#/components/schemas/CampaignStatus"

    CampaignMetrics:
      type: object
      required: [sent, delivered, read, replied, leads]
      properties:
        sent:
          type: integer
          minimum: 0
        delivered:
          type: integer
          minimum: 0
        read:
          type: integer
          minimum: 0
        replied:
          type: integer
          minimum: 0
        leads:
          type: integer
          minimum: 0

    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignMetrics"
        - type: object
          required:
            [id, name, objective, type, audience, subject, message, aiTone, scheduleType, scheduleDate, scheduleTime, frequency, triggerEvent, status, createdAt]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              minLength: 1
              maxLength: 80
            objective:
              type: string
              description: One of the objective option values, or empty.
            type:
              $ref: "#/components/schemas/CampaignChannel"
            audience:
              type: array
              description: Audience segment ids.
              items:
                type: string
            subject:
              type: string
              description: Required for Email campaigns.
            message:
              type: string
            aiTone:
              type: string
            scheduleType:
              $ref: "#/components/schemas/CampaignScheduleType"
            scheduleDate:
              type: [string, "null"]
              format: date
              description: Local calendar date. Required when scheduleType is scheduled.
            scheduleTime:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              description: Local time as HH:mm (scheduled and recurring campaigns).
            frequency:
              $ref: "#/components/schemas/CampaignFrequency"
            triggerEvent:
              type: string
              description: Required when scheduleType is triggered.
            status:
              $ref: "#/components/schemas/CampaignStatus"
            createdAt:
              type: string
              format: date-time

    TeamRole:
      type: string
      enum: [Owner, Admin, Agent]

    TeamInvitableRole:
      type: string
      description: Roles that can be given by invite or role change (not Owner).
      enum: [Admin, Agent]

    TeamMemberStatus:
      type: string
      enum: [active, invited]

    TeamMemberInvite:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/TeamInvitableRole"

    TeamMemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/TeamInvitableRole"

    TeamMember:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Defaults to the email's local part until the invite is accepted.
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/TeamRole"
        status:
          $ref: "#/components/schemas/TeamMemberStatus"
        createdAt:
          type: string
          format: date-time

    DomainStatus:
      type: string
      enum: [active, pending]

    DnsRecord:
      type: object
      required: [type, name, value]
      properties:
        type:
          type: string
          enum: [A, CNAME]
        name:
          type: string
        value:
          type: string

    DomainInput:
      type: object
      required: [domain, websiteId]
      properties:
        domain:
          type: string
          format: hostname
          description: Bare hostname, without protocol or path.
        websiteId:
          type: string
          description: The website this domain points to.

    Domain:
      type: object
      required: [id, domain, websiteId, websiteName, status, dnsRecords, createdAt]
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
          format: hostname
        websiteId:
          type: string
        websiteName:
          type: string
        status:
          $ref: "#/components/schemas/DomainStatus"
        dnsRecords:
          type: array
          description: Records to add at the registrar.
          items:
            $ref: "#/components/schemas/DnsRecord"
        createdAt:
          type: string
          format: date-time

    ApiKeyType:
      type: string
      enum: [production, development]

    ApiKeyInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        type:
          $ref: "#/components/schemas/ApiKeyType"

    ApiKey:
      type: object
      required: [id, name, type, preview, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ApiKeyType"
        preview:
          type: string
          description: Masked key for display, e.g. sk_live_••••4f2a.
        createdAt:
          type: string
          format: date-time

    ApiKeyWithSecret:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The full key. Only returned when the key is created.

    IntegrationId:
      type: string
      description: Catalog slug. Integrations are a fixed catalog, so these aren't UUIDs.
      enum:
        [whatsapp, gmail, outlook, twilio, googleCalendar, googleAnalytics, razorpay, stripe, salesforce, zoho]

    IntegrationSettings:
      type: object
      description: Settings for one integration, keyed by field id.
      additionalProperties:
        type: string

    Integration:
      type: object
      required: [id, connected, settings, connectedAt]
      properties:
        id:
          $ref: "#/components/schemas/IntegrationId"
        connected:
          type: boolean
        settings:
          $ref: "#/components/schemas/IntegrationSettings"
        connectedAt:
          type: [string, "null"]
          format: date-time

    IntegrationUpdate:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: "#/components/schemas/IntegrationSettings"

    IntegrationTestResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
