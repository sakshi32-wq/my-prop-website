          $ref: "#/components/responses/UnprocessableEntity"

  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Email a reset link. Always 204, so it doesn't reveal which emails exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "204":
          description: Sent if the account exists
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Signed out

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AutomationId:
      name: automationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebsiteId:
      name: websiteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IntegrationId"
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LeadId:
      name: leadId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LeadSource:
      type: string
      enum: [website, whatsapp, social, referral, walk-in]

    LeadStage:
      type: string
      enum: [new, contacted, interested, scheduled, negotiation, closed, lost]

    LeadInput:
      type: object
      description: Fields a client can set when creating a lead.
      required: [name, phone, source]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          description: Empty string when unknown.
        source:
          $ref: "#/components/schemas/LeadSource"
        budget:
          type: string
        configuration:
          type: string
        project:
          type: string
        stage:
          $ref: "#/components/schemas/LeadStage"
        tags:
          type: array
          items:
            type: string
        notes:
          type: string

    LeadUpdate:
      type: object
      description: Partial update. Omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
        source:
          $ref: "#/components/schemas/LeadSource"
        budget:
          type: string
        configuration:
          type: string
        project:
          type: string
        stage:
          $ref: "#/components/schemas/LeadStage"
        tags:
          type: array
          items:
            type: string
        notes:
          type: string

    Lead:
      type: object
      required:
        [id, name, phone, email, source, budget, configuration, project, stage, tags, notes, addedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        source:
          $ref: "#/components/schemas/LeadSource"
        budget:
          type: string
        configuration:
          type: string
        project:
          type: string
        stage:
          $ref: "#/components/schemas/LeadStage"
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        addedAt:
          type: string
          format: date-time

    CampaignChannel:
      type: string
      enum: [WhatsApp, Email, SMS]

    CampaignStatus:
      type: string
      enum: [active, paused, scheduled]

    CampaignScheduleType:
      type: string
      enum: [immediate, scheduled, recurring, triggered]

    CampaignFrequency:
      type: string
      enum: [daily, weekly, monthly]

    CampaignInput:
      type: object
      description: |
        Fields a client sets when creating a campaign. The client sends the
        status it launches with (scheduled or active); it defaults to active.
      required: [name, type, audience, message, scheduleType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        objective:
          type: string
          description: One of the objective option values, or empty.
        type:
          $ref: "#/components/schemas/CampaignChannel"
        audience:
          type: array
          description: Audience segment ids.
          items:
            type: string
        subject:
          type: string
          description: Required for Email campaigns.
        message:
          type: string
        aiTone:
          type: string
        scheduleType:
          $ref: "#/components/schemas/CampaignScheduleType"
        scheduleDate:
          type: [string, "null"]
          format: date
          description: Local calendar date. Required when scheduleType is scheduled.
        scheduleTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Local time as HH:mm (scheduled and recurring campaigns).
        frequency:
          $ref: "#/components/schemas/CampaignFrequency"
        triggerEvent:
          type: string
          description: Required when scheduleType is triggered.
        status:
          $ref: "#/components/schemas/CampaignStatus"

    CampaignUpdate:
      type: object
      description: Partial update. Omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        objective:
          type: string
          description: One of the objective option values, or empty.
        type:
          $ref: "#/components/schemas/CampaignChannel"
        audience:
          type: array
          description: Audience segment ids.
          items:
            type: string
        subject:
          type: string
          description: Required for Email campaigns.
        message:
          type: string
        aiTone:
          type: string
        scheduleType:
          $ref: "#/components/schemas/CampaignScheduleType"
        scheduleDate:
          type: [string, "null"]
          format: date
          description: Local calendar date. Required when scheduleType is scheduled.
        scheduleTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Local time as HH:mm (scheduled and recurring campaigns).
        frequency:
          $ref: "#/components/schemas/CampaignFrequency"
        triggerEvent:
          type: string
          description: Required when scheduleType is triggered.
        status:
          $ref: "#/components/schemas/CampaignStatus"

    CampaignMetrics:
      type: object
      required: [sent, delivered, read, replied, leads]
      properties:
        sent:
          type: integer
          minimum: 0
        delivered:
          type: integer
          minimum: 0
        read:
          type: integer
          minimum: 0
        replied:
          type: integer
          minimum: 0
        leads:
          type: integer
          minimum: 0

    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignMetrics"
        - type: object
          required:
            [id, name, objective, type, audience, subject, message, aiTone, scheduleType, scheduleDate, scheduleTime, frequency, triggerEvent, status, createdAt]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              minLength: 1
              maxLength: 80
            objective:
              type: string
              description: One of the objective option values, or empty.
            type:
              $ref: "#/components/schemas/CampaignChannel"
            audience:
              type: array
              description: Audience segment ids.
              items:
                type: string
            subject:
              type: string
              description: Required for Email campaigns.
            message:
              type: string
            aiTone:
              type: string
            scheduleType:
              $ref: "#/components/schemas/CampaignScheduleType"
            scheduleDate:
              type: [string, "null"]
              format: date
              description: Local calendar date. Required when scheduleType is scheduled.
            scheduleTime:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              description: Local time as HH:mm (scheduled and recurring campaigns).
            frequency:
              $ref: "#/components/schemas/CampaignFrequency"
            triggerEvent:
              type: string
              description: Required when scheduleType is triggered.
            status:
              $ref: "#/components/schemas/CampaignStatus"
            createdAt:
              type: string
              format: date-time

    TeamRole:
      type: string
      enum: [Owner, Admin, Agent]

    TeamInvitableRole:
      type: string
      description: Roles that can be given by invite or role change (not Owner).
      enum: [Admin, Agent]

    TeamMemberStatus:
      type: string
      enum: [active, invited]

    TeamMemberInvite:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/TeamInvitableRole"

    TeamMemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/TeamInvitableRole"

    TeamMember:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Defaults to the email's local part until the invite is accepted.
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/TeamRole"
        status:
          $ref: "#/components/schemas/TeamMemberStatus"
        createdAt:
          type: string
          format: date-time

    DomainStatus:
      type: string
      enum: [active, pending]

    DnsRecord:
      type: object
      required: [type, name, value]
      properties:
        type:
          type: string
          enum: [A, CNAME]
        name:
          type: string
        value:
          type: string

    DomainInput:
      type: object
      required: [domain, websiteId]
      properties:
        domain:
          type: string
          format: hostname
          description: Bare hostname, without protocol or path.
        websiteId:
          type: string
          format: uuid
          description: The website this domain points to.

    Domain:
      type: object
      required: [id, domain, websiteId, websiteName, status, dnsRecords, createdAt]
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
          format: hostname
        websiteId:
          type: string
          format: uuid
        websiteName:
          type: string
        status:
          $ref: "#/components/schemas/DomainStatus"
        dnsRecords:
          type: array
          description: Records to add at the registrar.
          items:
            $ref: "#/components/schemas/DnsRecord"
        createdAt:
          type: string
          format: date-time

    ApiKeyType:
      type: string
      enum: [production, development]

    ApiKeyInput:
      type: object
      required: [name, type]
      properties:
        name:
