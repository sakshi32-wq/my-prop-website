openapi: 3.1.0
info:
  title: myprop.live API
  version: 0.1.0
  description: |
    Schema-first contract for the myprop.live app. Until a backend exists it is
    served by MSW (src/mocks). Paths are relative to the /api server.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: leads
    description: CRM leads and their pipeline stage
  - name: campaigns
    description: WhatsApp, Email and SMS marketing campaigns
  - name: team
    description: Workspace members, invitations and roles
  - name: domains
    description: Custom domains that point to websites
  - name: api-keys
    description: Keys for calling the myprop.live API from other systems
  - name: integrations
    description: Third-party services the workspace connects to
  - name: websites
    description: Property websites and their builder content
  - name: templates
    description: The website template library, including saved AI templates
  - name: account
    description: The signed-in user's profile, preferences and password
  - name: analytics
    description: Read-only reporting for the dashboard and analytics pages
  - name: notifications
    description: In-app notifications shown under the header's bell
  - name: automations
    description: Lead follow-up automations (a trigger plus ordered steps)
  - name: ai
    description: AI Studio content generation, page design and history
  - name: billing
    description: Subscription, usage and invoices
  - name: auth
    description: Sign in, sign up, password reset and sign out

paths:
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads, newest first
      parameters:
        - name: q
          in: query
          description: Matches name, email or phone (digits only for phone-like queries).
          schema:
            type: string
        - name: source
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LeadSource"
        - name: stage
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LeadStage"
        - name: budget
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: configuration
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: project
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: tag
          in: query
          description: Leads that have at least one of these tags.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: addedFrom
          in: query
          description: Inclusive lower bound on addedAt.
          schema:
            type: string
            format: date-time
        - name: addedTo
          in: query
          description: Inclusive upper bound on addedAt.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Matching leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /leads/{leadId}:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead
      responses:
        "200":
          description: The lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update some fields of a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns, newest first
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CampaignStatus"
      responses:
        "200":
          description: Matching campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create (launch or schedule) a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /campaigns/{campaignId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update some fields of a campaign (also pauses and resumes it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /team/members:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List workspace members and pending invitations, oldest first
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: inviteTeamMember
      tags: [team]
      summary: Invite someone by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInvite"
      responses:
        "201":
          description: The invited member (status invited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /team/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: getTeamMember
      tags: [team]
      summary: Get a member
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Change a member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: removeTeamMember
      tags: [team]
      summary: Remove a member or cancel their invitation
      description: The workspace owner can't be removed (422).
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /domains:
    get:
      operationId: listDomains
      tags: [domains]
      summary: List custom domains, oldest first
      responses:
        "200":
          description: Domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDomain
      tags: [domains]
      summary: Add a domain. It stays pending until its DNS records verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainInput"
      responses:
        "201":
          description: The pending domain, with the DNS records to configure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /domains/{domainId}:
    parameters:
      - $ref: "#/components/parameters/DomainId"
    get:
      operationId: getDomain
      tags: [domains]
      summary: Get a domain
      responses:
        "200":
          description: The domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDomain
      tags: [domains]
      summary: Remove a domain
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /domains/{domainId}/verify:
    parameters:
      - $ref: "#/components/parameters/DomainId"
    post:
      operationId: verifyDomain
      tags: [domains]
      summary: Check the domain's DNS records now
      description: Returns the domain; status becomes active once the records resolve.
      responses:
        "200":
          description: The domain after the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List API keys, oldest first (secrets are never returned here)
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Generate a key. The response is the only time the secret is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: The new key, including its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyWithSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api-keys/{apiKeyId}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke a key. Requests using it are rejected from then on.
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: Connection state and settings of every available integration
      responses:
        "200":
          description: One entry per integration in the catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /integrations/{integrationId}:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    patch:
      operationId: updateIntegration
      tags: [integrations]
      summary: Save a connected integration's settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationUpdate"
      responses:
        "200":
          description: Updated integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /integrations/{integrationId}/connect:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    post:
      operationId: connectIntegration
      tags: [integrations]
      summary: Connect an integration
      responses:
        "200":
          description: The connected integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /integrations/{integrationId}/disconnect:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    post:
      operationId: disconnectIntegration
      tags: [integrations]
      summary: Disconnect an integration (its settings are kept)
      responses:
        "200":
          description: The disconnected integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /integrations/{integrationId}/test:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    post:
      operationId: testIntegration
      tags: [integrations]
      summary: Check that a connected integration responds with its saved settings
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /websites:
    get:
      operationId: listWebsites
      tags: [websites]
      summary: List websites, oldest first
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/WebsiteStatus"
      responses:
        "200":
          description: Matching websites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Website"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createWebsite
      tags: [websites]
      summary: Create a draft website from the wizard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteInput"
      responses:
        "201":
          description: The new draft website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /websites/{websiteId}:
    parameters:
      - $ref: "#/components/parameters/WebsiteId"
    get:
      operationId: getWebsite
      tags: [websites]
      summary: Get a website
      responses:
        "200":
          description: The website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /websites/{websiteId}/content:
    parameters:
      - $ref: "#/components/parameters/WebsiteId"
    get:
      operationId: getWebsiteContent
      tags: [websites]
      summary: The builder document (project info and page sections)
      responses:
        "200":
          description: The saved content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveWebsiteContent
      tags: [websites]
      summary: Save the builder document. Also renames the website and updates its tools.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteContentInput"
      responses:
        "200":
          description: The saved content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /websites/{websiteId}/publish:
    parameters:
      - $ref: "#/components/parameters/WebsiteId"
    post:
      operationId: publishWebsite
      tags: [websites]
      summary: Publish the saved content (the website becomes live)
      responses:
        "200":
          description: The live website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List templates, newest first (saved custom templates come first)
      parameters:
        - name: q
          in: query
          description: Matches name, description, category and tags.
          schema:
            type: string
        - name: price
          in: query
          schema:
            $ref: "#/components/schemas/TemplatePrice"
        - name: category
          in: query
          schema:
            type: string
        - name: tag
          in: query
          description: Templates that have all of these tags.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Matching templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Save a custom (AI-generated) template to the library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: The saved template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a template
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: The signed-in user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [account]
      summary: Update profile details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [account]
      summary: Which notifications the user receives
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateNotificationPreferences
      tags: [account]
      summary: Turn notifications on or off (omitted ones are unchanged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /me/password:
    post:
      operationId: changePassword
      tags: [account]
      summary: Change the password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analytics/overview:
    get:
      operationId: getDashboardOverview
      tags: [analytics]
      summary: Headline numbers and charts for the dashboard
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /analytics/report:
    get:
      operationId: getAnalyticsReport
      tags: [analytics]
      summary: Analytics for a date range (both ends inclusive)
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications, newest first
      responses:
        "200":
