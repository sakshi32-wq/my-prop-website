        status:
          type: string
          enum: [paid, open, failed]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        remember:
          type: boolean
          description: Keep the session for longer.

    RegisterInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        company:
          type: string
        password:
          type: string
          minLength: 8

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    AuthSession:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 'Send as "Authorization: Bearer <token>".'
        user:
          $ref: "#/components/schemas/Profile"
