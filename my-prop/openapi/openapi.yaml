      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: The new session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
