openapi: 3.1.0
info:
  title: myprop.live API
  version: 0.1.0
  description: |
    Schema-first contract for the myprop.live app. Until a backend exists it is
    served by MSW (src/mocks). Paths are relative to the /api server.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: leads
    description: CRM leads and their pipeline stage
  - name: campaigns
    description: WhatsApp, Email and SMS marketing campaigns

paths:
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads, newest first
      parameters:
        - name: q
          in: query
          description: Matches name, email or phone (digits only for phone-like queries).
          schema:
            type: string
        - name: source
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LeadSource"
        - name: stage
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LeadStage"
        - name: budget
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: configuration
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: project
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: tag
          in: query
          description: Leads that have at least one of these tags.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: addedFrom
          in: query
          description: Inclusive lower bound on addedAt.
          schema:
            type: string
            format: date-time
        - name: addedTo
          in: query
          description: Inclusive upper bound on addedAt.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Matching leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /leads/{leadId}:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead
      responses:
        "200":
          description: The lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update some fields of a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns, newest first
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CampaignStatus"
      responses:
        "200":
          description: Matching campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create (launch or schedule) a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /campaigns/{campaignId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update some fields of a campaign (also pauses and resumes it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LeadId:
      name: leadId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LeadSource:
      type: string
      enum: [website, whatsapp, social, referral, walk-in]

    LeadStage:
      type: string
      enum: [new, contacted, interested, scheduled, negotiation, closed, lost]

    LeadInput:
      type: object
      description: Fields a client can set when creating a lead.
      required: [name, phone, source]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          description: Empty string when unknown.
        source:
          $ref: "#/components/schemas/LeadSource"
        budget:
          type: string
        configuration:
          type: string
        project:
          type: string
        stage:
          $ref: "#/components/schemas/LeadStage"
        tags:
          type: array
          items:
            type: string
        notes:
          type: string

    LeadUpdate:
      type: object
      description: Partial update. Omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
        source:
          $ref: "#/components/schemas/LeadSource"
        budget:
          type: string
        configuration:
          type: string
        project:
          type: string
        stage:
          $ref: "#/components/schemas/LeadStage"
        tags:
          type: array
          items:
            type: string
        notes:
          type: string

    Lead:
      type: object
      required:
        [id, name, phone, email, source, budget, configuration, project, stage, tags, notes, addedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        source:
          $ref: "#/components/schemas/LeadSource"
        budget:
          type: string
        configuration:
          type: string
        project:
          type: string
        stage:
          $ref: "#/components/schemas/LeadStage"
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        addedAt:
          type: string
          format: date-time

    CampaignChannel:
      type: string
      enum: [WhatsApp, Email, SMS]

    CampaignStatus:
      type: string
      enum: [active, paused, scheduled]

    CampaignScheduleType:
      type: string
      enum: [immediate, scheduled, recurring, triggered]

    CampaignFrequency:
      type: string
      enum: [daily, weekly, monthly]

    CampaignInput:
      type: object
      description: |
        Fields a client sets when creating a campaign. The client sends the
        status it launches with (scheduled or active); it defaults to active.
      required: [name, type, audience, message, scheduleType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        objective:
          type: string
          description: One of the objective option values, or empty.
        type:
          $ref: "#/components/schemas/CampaignChannel"
        audience:
          type: array
          description: Audience segment ids.
          items:
            type: string
        subject:
          type: string
          description: Required for Email campaigns.
        message:
          type: string
        aiTone:
          type: string
        scheduleType:
          $ref: "#/components/schemas/CampaignScheduleType"
        scheduleDate:
          type: [string, "null"]
          format: date
          description: Local calendar date. Required when scheduleType is scheduled.
        scheduleTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Local time as HH:mm (scheduled and recurring campaigns).
        frequency:
          $ref: "#/components/schemas/CampaignFrequency"
        triggerEvent:
          type: string
          description: Required when scheduleType is triggered.
        status:
          $ref: "#/components/schemas/CampaignStatus"

    CampaignUpdate:
      type: object
      description: Partial update. Omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        objective:
          type: string
          description: One of the objective option values, or empty.
        type:
          $ref: "#/components/schemas/CampaignChannel"
        audience:
          type: array
          description: Audience segment ids.
          items:
            type: string
        subject:
          type: string
          description: Required for Email campaigns.
        message:
          type: string
        aiTone:
          type: string
        scheduleType:
          $ref: "#/components/schemas/CampaignScheduleType"
        scheduleDate:
          type: [string, "null"]
          format: date
          description: Local calendar date. Required when scheduleType is scheduled.
        scheduleTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Local time as HH:mm (scheduled and recurring campaigns).
        frequency:
          $ref: "#/components/schemas/CampaignFrequency"
        triggerEvent:
          type: string
          description: Required when scheduleType is triggered.
        status:
          $ref: "#/components/schemas/CampaignStatus"

    CampaignMetrics:
      type: object
      required: [sent, delivered, read, replied, leads]
      properties:
        sent:
          type: integer
          minimum: 0
        delivered:
          type: integer
          minimum: 0
        read:
          type: integer
          minimum: 0
        replied:
          type: integer
          minimum: 0
        leads:
          type: integer
          minimum: 0

    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignMetrics"
        - type: object
          required:
            [id, name, objective, type, audience, subject, message, aiTone, scheduleType, scheduleDate, scheduleTime, frequency, triggerEvent, status, createdAt]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              minLength: 1
              maxLength: 80
            objective:
              type: string
              description: One of the objective option values, or empty.
            type:
              $ref: "#/components/schemas/CampaignChannel"
            audience:
              type: array
              description: Audience segment ids.
              items:
                type: string
            subject:
              type: string
              description: Required for Email campaigns.
            message:
              type: string
            aiTone:
              type: string
            scheduleType:
              $ref: "#/components/schemas/CampaignScheduleType"
            scheduleDate:
              type: [string, "null"]
              format: date
              description: Local calendar date. Required when scheduleType is scheduled.
            scheduleTime:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              description: Local time as HH:mm (scheduled and recurring campaigns).
            frequency:
              $ref: "#/components/schemas/CampaignFrequency"
            triggerEvent:
              type: string
              description: Required when scheduleType is triggered.
            status:
              $ref: "#/components/schemas/CampaignStatus"
            createdAt:
              type: string
              format: date-time
